services:
  - type: web
    name: ev-web-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    buildFilter:
      paths:
        - src/ev_web/**
        - model/**
        - pyproject.toml
        - uv.lock
        - Dockerfile
        - .dockerignore
    envVars:
      - key: CORS_ORIGINS
        sync: false
